<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pour Toi ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0b1a;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: #fff;
        }

        /* الحاوية الرئيسية للقلب */
        .heart-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* رسم حدود القلب بالـ SVG تدريجياً */
        .heart-svg {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .heart-path {
            fill: none;
            stroke: #ff1744;
            stroke-width: 5;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawHeart 2.5s forwards ease-in-out;
            filter: drop-shadow(0 0 10px #ff1744);
        }

        @keyframes drawHeart {
            to {
                stroke-dashoffset: 0;
            }
        }

        /* إطار الصورة وشكل القلب */
        .image-container {
            width: 260px;
            height: 260px;
            clip-path: path('M 130 235 C 130 235 240 160 240 95 C 240 45 200 15 155 15 C 130 15 130 45 130 45 C 130 45 130 15 105 15 C 60 15 20 45 20 95 C 20 160 130 235 130 235 Z');
            opacity: 0;
            animation: fadeInImage 1s forwards ease-in 2s, pulse 2s infinite ease-in-out 3s;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ff1744;
            padding: 4px;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            clip-path: path('M 126 228 C 126 228 232 155 232 92 C 232 43 194 15 150 15 C 126 15 126 44 126 44 C 126 44 126 15 102 15 C 58 15 20 43 20 92 C 20 155 126 228 126 228 Z');
        }

        @keyframes fadeInImage {
            to {
                opacity: 1;
            }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }

        /* منطقة النصوص والأنيميشن حرفاً بحرف */
        .text-container {
            margin-top: 25px;
            text-align: center;
        }

        .name-text {
            font-size: 32px;
            font-weight: bold;
            color: #ff8fa3;
            text-shadow: 0 0 15px rgba(255, 143, 163, 0.7);
            min-height: 40px;
            letter-spacing: 2px;
        }

        .sub-text {
            font-size: 18px;
            color: #e0e0e0;
            margin-top: 8px;
            min-height: 25px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="heart-wrapper">
        <!-- رسم حدود القلب -->
        <svg class="heart-svg" viewBox="0 0 260 260">
            <path class="heart-path" d="M 130 235 C 130 235 240 160 240 95 C 240 45 200 15 155 15 C 130 15 130 45 130 45 C 130 45 130 15 105 15 C 60 15 20 45 20 95 C 20 160 130 235 130 235 Z"/>
        </svg>

        <!-- الصورة داخل القلب -->
        <div class="image-container">
            <img src="love.jpg" alt="Love">
        </div>
    </div>

    <div class="text-container">
        <div class="name-text" id="typewriter-name"></div>
        <div class="sub-text" id="typewriter-sub"></div>
    </div>

    <script>
        // دالة لكتابة النصوص حرفاً بحرف
        function typeWriter(elementId, text, speed, delay, callback) {
            setTimeout(() => {
                let i = 0;
                const element = document.getElementById(elementId);
                const timer = setInterval(() => {
                    if (i < text.length) {
                        element.innerHTML += text.charAt(i);
                        i++;
                    } else {
                        clearInterval(timer);
                        if (callback) callback();
                    }
                }, speed);
            }, delay);
        }

        // تشغيل تأثير الكتابة بعد رسم القلب
        typeWriter('typewriter-name', '❤️ Medoud', 120, 2200, () => {
            typeWriter('typewriter-sub', 'Pour toujours et à jamais...', 80, 300);
        });
    </script>

</body>
</html>
